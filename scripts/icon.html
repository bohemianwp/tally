<!doctype html>
<!-- Tally 图标源文件（第四版）：渐变底 + 白色圆币 + 计数刻痕「四竖一斜」（全世界通用的 tally marks）。用 scripts/make_icon.sh 转成 PNG -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#0f766e}svg{display:block}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset=".55" stop-color="#0d9488"/><stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <radialGradient id="coin" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6f4f1"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#053b37" flood-opacity=".35"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="164" fill="url(#coin)" filter="url(#sh)"/>
  <circle cx="256" cy="256" r="142" fill="none" stroke="#0d9488" stroke-opacity=".18" stroke-width="4"/>
  <g stroke="#0f766e" stroke-width="24" stroke-linecap="round">
    <line x1="190" y1="190" x2="190" y2="322"/><line x1="234" y1="190" x2="234" y2="322"/>
    <line x1="278" y1="190" x2="278" y2="322"/><line x1="322" y1="190" x2="322" y2="322"/>
  </g>
  <line x1="160" y1="300" x2="352" y2="212" stroke="#f59e0b" stroke-width="24" stroke-linecap="round"/>
</svg>
</body></html>
